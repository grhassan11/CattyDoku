[versions]
# Toolchain (agp, kotlin, ksp, hilt) is bumped separately, AGP in its own commit after a green build.
# 2026-11-06 bump: non-toolchain libs raised to the newest STABLE that still compiles against compileSdk 36 (verified on dl.google.com Maven):
#   core-ktx 1.19.x, navigation 2.10.x, lifecycle 2.11.x, Compose BOM 2026.08+ need compileSdk 37 -> held back. Firebase BoM 35.x (major) and UMP 4.x (major) not taken.
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.3"
hilt = "2.57.1"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
work = "2.11.2"
coreSplashscreen = "1.0.1"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigation = "2.9.8"
hiltNavigationCompose = "1.3.0"
room = "2.8.5"
datastore = "1.2.1"
coroutines = "1.10.2"
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
# Ads / consent (phase 9). Kept as is: bump SDK + adapters TOGETHER.
adsMobileSdk = "1.6.0"
metaAdapter = "6.22.0.1"
unityAds = "4.21.0"
unityAdapter = "4.21.0.0"
# Explicit UMP pin (Gradle picks the higher of this and the SDK transitive). 4.0.0 exists (major), not taken.
ump = "3.2.0"
# Play Billing (Store). 9.1.0 = newest stable billing-ktx on Google Maven (2026-11-06). Keep core + ktx on the same version.
billing = "9.1.0"
# Firebase (phase 10). Libs below are BoM-managed (no versions). BoM 34.19.0 = newest 34.x; 35.1.0 exists (major, not taken).
firebaseBom = "34.19.0"
googleServices = "4.4.3"
firebaseCrashlyticsPlugin = "3.0.4"
# Baseline Profile (phase 11): baselineProfile / benchmarkMacro 1.5.0, uiautomator 2.4.0, testExtJunit 1.3.0, profileinstaller 1.4.1 (all latest stable).
# If sync fails on AGP 8.13.0, try baselineProfile/benchmarkMacro 1.4.1.
profileinstaller = "1.4.1"
baselineProfile = "1.5.0"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
testExtJunit = "1.3.0"

[libraries]
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# GMA Next-Gen SDK ONLY (com.google.android.libraries.ads.mobile.sdk). Legacy play-services-ads* excluded in app/build.gradle.kts.
ads-mobile-sdk = { module = "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk", version.ref = "adsMobileSdk" }
ads-mediation-facebook = { module = "com.google.ads.mediation:facebook", version.ref = "metaAdapter" }
ads-mediation-unity = { module = "com.google.ads.mediation:unity", version.ref = "unityAdapter" }
unity-ads = { module = "com.unity3d.ads:unity-ads", version.ref = "unityAds" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }

# Google Play Billing (KTX pulls in the core library).
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

# Firebase via BoM (34+: Kotlin extensions live in the main artifacts, no -ktx modules).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-config = { module = "com.google.firebase:firebase-config" }

# Baseline profile: app side installs the profile; :baselineprofile (test module) generates it.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Applied in :app ONLY when app/google-services.json exists (see app/build.gradle.kts).
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
